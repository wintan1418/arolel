<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Browser not supported · Arolel</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 20px; background: #f6f5f1; color: #14161a; font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
    main { width: 100%; max-width: 520px; }
    .eyebrow { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: #636363; }
    h1 { font-family: Georgia, "Times New Roman", serif; font-weight: 500; font-size: clamp(32px, 7vw, 48px); line-height: 1.05; letter-spacing: -0.02em; margin: 12px 0 14px; }
    p { font-size: 16px; line-height: 1.6; color: #404040; margin: 0 0 24px; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; }
    a.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 18px; border-radius: 9px; font-weight: 600; font-size: 14px; text-decoration: none; border: 1px solid #d4d3cf; background: #fff; color: #14161a; }
    a.btn.primary { background: #2f6f4e; border-color: #2f6f4e; color: #fff; }
    .mark { font-family: Georgia, serif; font-size: 22px; margin-bottom: 28px; }
    .mark span { color: #3ca676; }
    code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; color: #636363; }
  </style>
</head>
<body>
  <main>
    <div class="mark">arolel<span>.</span></div>
    <div class="eyebrow">Browser too old</div>
    <h1>Your browser can't run Arolel's tools.</h1>
    <p>The file tools run inside your browser and need a current version of Chrome, Edge, Firefox or Safari. Update your browser or open this page in another one.</p>
    <div class="actions">
      <a class="btn primary" href="/">Go to the home page</a>
      
    </div>
  </main>
</body>
</html>
